name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Unzip project
        run: unzip -q ShipraApp.zip
      - name: Write API key
        working-directory: ShipraApp
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p app/src/main/res/values
          echo "<?xml version='1.0' encoding='utf-8'?>" > app/src/main/res/values/keys.xml
          echo "<resources>" >> app/src/main/res/values/keys.xml
          echo "    <string name='gemini_api_key'>$GEMINI_API_KEY</string>" >> app/src/main/res/values/keys.xml
          echo "</resources>" >> app/src/main/res/values/keys.xml
      - name: Build APK with Gradle
        working-directory: ShipraApp
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shipra-APK
          path: ShipraApp/app/build/outputs/apk/debug/app-debug.apk
